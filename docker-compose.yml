services:
  # 1. Banco de Dados
  db:
    image: postgres:15-alpine
    container_name: logitrack-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - logitrack-network

  # 2. Backend (Spring Boot + Java 17)
  backend:
    build:
      context: ./backend # Pasta onde está o código Java e o Dockerfile do Spring Boot
      dockerfile: Dockerfile
    container_name: logitrack-backend
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL:-jdbc:postgresql://db:5432/${POSTGRES_DB}}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      SPRING_JPA_HIBERNATE_DDL_AUTO: ${SPRING_JPA_HIBERNATE_DDL_AUTO:-validate}
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      - db
    networks:
      - logitrack-network

  # 3. Frontend (Next.js + TypeScript + Tailwind CSS)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: logitrack-frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL}
    depends_on:
      - backend
    networks:
      - logitrack-network

networks:
  logitrack-network:
    driver: bridge
